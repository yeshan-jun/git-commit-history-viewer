name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect publish mode
        id: mode
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "mode=source" >> "$GITHUB_OUTPUT"
          else
            echo "mode=static" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.mode.outputs.mode == 'source'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.mode.outputs.mode == 'source'
        run: npm ci

      - name: Build site
        if: steps.mode.outputs.mode == 'source'
        run: npm run build

      - name: Copy project documentation
        if: steps.mode.outputs.mode == 'source'
        run: |
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE
          cp -R .github dist/.github

      - name: Prepare static site
        id: site
        shell: bash
        run: |
          if [[ "${{ steps.mode.outputs.mode }}" == "source" ]]; then
            echo "path=dist" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf _site
          mkdir -p _site
          shopt -s dotglob
          for source_path in * .[^.]*; do
            if [[ ! -e "${source_path}" ]]; then
              continue
            fi

            case "${source_path}" in
              .git|.github|_site)
                continue
                ;;
            esac

            cp -R "${source_path}" _site/
          done

          echo "path=_site" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
